[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo-support-intelligence"
version = "0.1.0"
description = "Deterministic support analytics and decision-support dashboard"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pyarrow>=15.0", "pandas>=2.0", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
